<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Vibrant Brand Cyan/Blue Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0038FF"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="0" r="1.5" fill="#00D2FF" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="210" r="220" fill="#0066FF" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="1050" cy="100" r="280" fill="#7000FF" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="380" r="180" fill="#00D2FF" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Geometric Accent Lines -->
  <path d="M 0 380 L 350 380 L 420 420" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 1200 40 L 920 40 L 860 0" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="350" cy="380" r="4" fill="#00D2FF"/>
  <circle cx="920" cy="40" r="4" fill="#00F0FF"/>

  <!-- Logo Container Box -->
  <g transform="translate(80, 85)">
    <!-- Outer Glow Box -->
    <rect x="0" y="0" width="250" height="250" rx="36" fill="#0D1527" stroke="url(#brandGrad)" stroke-width="2.5" filter="url(#softGlow)"/>
    <rect x="10" y="10" width="230" height="230" rx="28" fill="#080C16" stroke="#1E293B" stroke-width="1"/>

    <!-- Stylized ZK Logo Vector Geometry -->
    <path d="M 50 70 L 175 70 C 190 70 200 80 195 95 L 140 160 L 205 160 C 215 160 220 170 215 180 L 195 200 C 190 205 180 205 170 205 L 45 205 C 30 205 25 195 35 180 L 105 95 L 45 95 C 35 95 30 85 35 75 Z" fill="url(#brandGrad)" filter="url(#softGlow)"/>
    <path d="M 115 110 L 180 175 C 185 180 195 180 200 175 L 210 165 C 215 160 215 150 210 145 L 155 90 Z" fill="#00D2FF" opacity="0.9"/>
  </g>

  <!-- Typography & Content -->
  <!-- Tagline Badge -->
  <g transform="translate(380, 85)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#0E223D" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="16" r="5" fill="#00FF66"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00D2FF" letter-spacing="1.5">ZERAVRIX MOBILE ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(380, 175)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      ZERAVRIX <tspan fill="url(#brandGrad)">PHONE 2.0</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(380, 220)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Next-Generation Manga &amp; Manhwa Reader for Android
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(380, 260)">
    <!-- Pill 1: Engine -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#131D31" stroke="#253553" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8">⚡ Tachiyomi &amp; Mihon APKs</text>
    </g>

    <!-- Pill 2: Acceleration -->
    <g transform="translate(232, 0)">
      <rect x="0" y="0" width="185" height="34" rx="8" fill="#131D31" stroke="#253553" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#60A5FA">🚀 OkHttp 5 + Brotli</text>
    </g>

    <!-- Pill 3: Reader -->
    <g transform="translate(429, 0)">
      <rect x="0" y="0" width="195" height="34" rx="8" fill="#131D31" stroke="#253553" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#A78BFA">📖 Seamless Webtoon</text>
    </g>
  </g>

  <!-- Technical Spec Bar -->
  <g transform="translate(380, 318)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">
      <tspan fill="#38BDF8" font-weight="700">100% Kotlin</tspan> • MVVM Clean Architecture • Auto-Trust Sandbox • Room Database • Zero Telemetry
    </text>
  </g>

  <!-- Release Tag Badge (Right Side) -->
  <g transform="translate(1030, 85)">
    <rect x="0" y="0" width="90" height="32" rx="16" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="45" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#A5B4FC" text-anchor="middle">v2.0.0</text>
  </g>
</svg>